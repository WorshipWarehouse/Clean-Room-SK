name: append-progress
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Append the section
        run: |
          python3 tools/append_expression_progress.py
      - name: Commit and push
        run: |
          git config user.name WorshipWarehouse
          git config user.email worshipwarehousesite@gmail.com
          git rm -q .github/workflows/append-progress.yml tools/append_expression_progress.py
          git add docs/progress.md
          git commit -q -m "Note the expression milestone in the progress log"
          git push origin HEAD:main
