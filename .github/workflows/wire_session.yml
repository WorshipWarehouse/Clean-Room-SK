name: wire session memory

# One shot. The app model is too large to replace through a single repository API
# call, so this checks the file out, patches it with tools/wire_session.py and pushes
# the result. The script refuses to write unless every anchor is exactly where it is
# expected, and this workflow deletes both files once the change is in.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch the model
        run: |
          set -o pipefail
          python3 tools/wire_session.py
          git diff --stat
          git diff -- Sources/SundayKeysApp/AppModel.swift

      - name: Commit and push
        run: |
          set -o pipefail
          git config user.name "WorshipWarehouse"
          git config user.email "worshipwarehousesite@gmail.com"
          git add Sources/SundayKeysApp/AppModel.swift
          git commit -m "Restore the remembered patch in the app model [skip ci]"
          git push origin main
          git log -1 --format='%H %s'
