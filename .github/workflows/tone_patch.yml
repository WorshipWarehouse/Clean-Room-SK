name: tone-patch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tone-patch
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Apply the tone patch
        run: python3 tools/tone_patch.py
      - name: Write the record and remove this job
        run: python3 tools/tone_docs.py
      - name: Repair the generated sources
        run: |
          python3 - <<'PY'
          import pathlib

          repaired = 0
          removed = 0
          paths = list(pathlib.Path("Sources").rglob("*.swift")) + list(pathlib.Path("Tests").rglob("*.swift"))
          for path in paths:
              text = path.read_text(encoding="utf-8", errors="replace")
              if "\x01" in text:
                  for index, line in enumerate(text.splitlines(), 1):
                      if "\x01" in line:
                          repaired += 1
                          print("::warning file=%s,line=%d::indentation placeholder repaired" % (path, index))
                  text = text.replace("\x01", "            ")
              cleaned = "".join(ch for ch in text if ch in "\n\t" or ord(ch) >= 32)
              if cleaned != text:
                  for index, line in enumerate(text.splitlines(), 1):
                      for ch in line:
                          if ch not in "\n\t" and ord(ch) < 32:
                              removed += 1
                              print("::error file=%s,line=%d::control character U+%04X removed" % (path, index, ord(ch)))
                  path.write_text(cleaned, encoding="utf-8")
              elif text != path.read_text(encoding="utf-8", errors="replace"):
                  path.write_text(text, encoding="utf-8")
          print("placeholders repaired: %d, control characters removed: %d" % (repaired, removed))
          PY
      - name: Build with tests
        run: |
          swift build --build-tests > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then tail -n 80 /tmp/build.log; fi
          exit $status
      - name: Test
        run: |
          swift test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then grep -E "error:|failed" /tmp/test.log | head -n 20; fi
          exit $status
      - name: Publish a failing log
        if: failure()
        run: |
          git config user.email ci@example.com
          git config user.name "tone patch job"
          cp /tmp/build.log build.log 2>/dev/null || true
          cp /tmp/test.log test.log 2>/dev/null || true
          git checkout --orphan ci-diag
          git add -A
          git commit -m "diagnostic logs" || true
          git push -f origin ci-diag
      - name: Commit
        run: |
          git config user.email ci@example.com
          git config user.name "tone patch job"
          git add -A
          git commit -m "Add per-layer tone and rework the render budget gate"
      - name: Push
        run: git push origin HEAD:main
