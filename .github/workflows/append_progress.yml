name: append-progress

# One-shot: append docs/re/isolation-append.md to docs/progress.md, then delete
# both this workflow and the section file in the same commit, so the machinery
# never stays in the tree. Pushed with GITHUB_TOKEN, which does not re-trigger
# the build workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Append the section and remove the one-shot machinery
        run: |
          set -euo pipefail
          section=docs/re/isolation-append.md
          test -f "$section"
          test -f docs/progress.md
          printf '\n' >> docs/progress.md
          cat "$section" >> docs/progress.md
          rm -f "$section"
          rm -f .github/workflows/append_progress.yml
          git config user.name "WorshipWarehouse"
          git config user.email "worshipwarehousesite@gmail.com"
          git add -A docs/progress.md
          git add -A "$section" .github/workflows/append_progress.yml
          git commit -m "Record the MIDI transport isolation correction and its CI gate"
          git push origin HEAD:main
