name: Append progress

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Append the milestone and remove this machinery
        run: |
          set -euo pipefail
          echo '--- tail before append ---'
          tail -n 30 docs/progress.md
          printf '\n' >> docs/progress.md
          cat docs/re/midi-route-append.md >> docs/progress.md
          echo '--- tail after append ---'
          tail -n 30 docs/progress.md
          git rm -q docs/re/midi-route-append.md
          git rm -q .github/workflows/append_progress.yml
          git config user.name 'WorshipWarehouse'
          git config user.email 'worshipwarehousesite@gmail.com'
          git add docs/progress.md
          git commit -m 'Record the typed MIDI routing milestone in the progress log'
          git push origin HEAD:main
