name: append-progress
on: workflow_dispatch
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Append the section and remove the machinery
        run: cat docs/re/progress-append.md >> docs/progress.md && rm -f docs/re/progress-append.md .github/workflows/append_progress.yml && git config user.name WorshipWarehouse && git config user.email worshipwarehousesite@gmail.com && git add -A && git commit -m "Record the arp pattern and octave span milestone" && git push
