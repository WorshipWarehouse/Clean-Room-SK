name: files-update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply the packet-level receive fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          NL = chr(10)
          BS = chr(92)

          def edit(path, old_lines, new_lines):
              file = Path(path)
              text = file.read_text()
              old = NL.join(old_lines)
              count = text.count(old)
              if count != 1:
                  print(f"::error::files-update: anchor found {count} times in {path}")
                  raise SystemExit(1)
              file.write_text(text.replace(old, NL.join(new_lines)))
              print(f"edited {path}")

          edit(
              "Sources/SundayKeysCore/MIDIMessage.swift",
              [
                  "            return .other(status: status, data: Array(bytes.dropFirst()))",
                  "        }",
                  "    }",
                  "}",
              ],
              [
                  "            return .other(status: status, data: Array(bytes.dropFirst()))",
                  "        }",
                  "    }",
                  "",
                  "    /// Parses every complete message in one packet's worth of bytes.",
                  "    ///",
                  "    /// A MIDI 1.0 packet is not one message. Running status, several messages in a",
                  "    /// single packet and real-time bytes between them are all legal on the wire,",
                  "    /// and CoreMIDI does deliver them that way: a note on, a note off and a",
                  "    /// control change sent back to back can arrive as a single packet. Parsing",
                  "    /// only the first three bytes of such a packet keeps the note on and silently",
                  "    /// loses the rest, which is the defect the receive probe caught.",
                  "    public static func parseAll(_ bytes: [UInt8]) -> [MIDIMessage] {",
                  "        var messages: [MIDIMessage] = []",
                  "        var index = 0",
                  "        var runningStatus: UInt8?",
                  "",
                  "        while index < bytes.count {",
                  "            let byte = bytes[index]",
                  "",
                  "            // Real-time messages are one byte and may sit inside another",
                  "            // message. Nothing consumes them yet, and they leave the running",
                  "            // status alone.",
                  "            if byte >= 0xF8 {",
                  "                index += 1",
                  "                continue",
                  "            }",
                  "",
                  "            var status = byte",
                  "            var start = index",
                  "",
                  "            if byte >= 0x80 {",
                  "                runningStatus = byte",
                  "                start = index + 1",
                  "            } else if let running = runningStatus {",
                  "                status = running",
                  "            } else {",
                  "                // Data with no status to apply it to is a fragment, not a",
                  "                // message.",
                  "                index += 1",
                  "                continue",
                  "            }",
                  "",
                  "            if status >= 0xF0 {",
                  "                // System common messages vary in length and the engine has",
                  "                // no use for them. Dropping the status keeps the channel",
                  "                // messages after it in the same packet parseable.",
                  "                runningStatus = nil",
                  "                index += 1",
                  "                continue",
                  "            }",
                  "",
                  "            let type = status & 0xF0",
                  "            let dataCount = type == 0xC0 || type == 0xD0 ? 1 : 2",
                  "            let end = start + dataCount",
                  "",
                  "            guard end <= bytes.count,",
                  "                  bytes[start..<end].allSatisfy({ $0 < 0x80 })",
                  "            else {",
                  "                // Truncated, or a status byte where data should be: the",
                  "                // rest of the packet cannot be trusted, and a partial",
                  "                // message is not a message.",
                  "                break",
                  "            }",
                  "",
                  "            if let message = parse([status] + Array(bytes[start..<end])) {",
                  "                messages.append(message)",
                  "            }",
                  "            index = end",
                  "        }",
                  "",
                  "        return messages",
                  "    }",
                  "}",
              ],
          )

          edit(
              "Sources/SundayKeysApp/MIDI/MIDIInputService.swift",
              [
                  "    private func receive(_ packetList: UnsafePointer<MIDIPacketList>) {",
                  "        var packet = packetList.pointee.packet",
                  "        let count = Int(packetList.pointee.numPackets)",
                  "",
                  "        for _ in 0..<count {",
                  "            let length = Int(packet.length)",
                  "            if length >= 2 {",
                  "                var bytes: [UInt8] = [packet.data.0, packet.data.1]",
                  "                if length >= 3 {",
                  "                    bytes.append(packet.data.2)",
                  "                }",
                  "                if let message = MIDIMessage.parse(bytes) {",
                  "                    onMessage?(message)",
                  "                }",
                  "            }",
                  "            packet = MIDIPacketNext(&packet).pointee",
                  "        }",
                  "    }",
              ],
              [
                  "    private func receive(_ packetList: UnsafePointer<MIDIPacketList>) {",
                  "        // A packet is not a message: CoreMIDI concatenates messages and",
                  "        // running status is legal, so the whole packet goes to the core",
                  "        // parser. Reading only the first three bytes kept the note on and",
                  "        // lost the note off and the control change behind it.",
                  "        var packet = packetList.pointee.packet",
                  "        let count = Int(packetList.pointee.numPackets)",
                  "",
                  "        for _ in 0..<count {",
                  "            let length = min(",
                  "                Int(packet.length),",
                  "                MemoryLayout.size(ofValue: packet.data)",
                  "            )",
                  "            let bytes = withUnsafeBytes(of: packet.data) {",
                  "                Array($0.prefix(length))",
                  "            }",
                  "            for message in MIDIMessage.parseAll(bytes) {",
                  "                onMessage?(message)",
                  "            }",
                  "            packet = MIDIPacketNext(&packet).pointee",
                  "        }",
                  "    }",
              ],
          )

          edit(
              "Sources/SundayKeysCore/MIDI/MIDIReceiveProbe.swift",
              [
                  "        lines.append(",
                  '            "MIDI receive probe: the app received ' + BS + '(received.count) message(s): ' + BS + '(counts.noteOns) note on, ' + BS + '(counts.noteOffs) note off, ' + BS + '(counts.controlChanges) control change"',
                  "        )",
              ],
              [
                  "        lines.append(",
                  '            "MIDI receive probe: the app received ' + BS + '(received.count) message(s): ' + BS + '(counts.noteOns) note on, ' + BS + '(counts.noteOffs) note off, ' + BS + '(counts.controlChanges) control change"',
                  "        )",
                  "",
                  "        // One line per message, so the step output says which message came",
                  "        // back rather than only how many of each the summary counted.",
                  '        lines.append(contentsOf: received.map { "MIDI receive probe: received ' + BS + '(name(of: $0))" })',
              ],
          )

          edit(
              "Sources/SundayKeysCore/MIDI/MIDIReceiveProbe.swift",
              [
                  "    /// Counts only the messages the probe means to send, so a stray packet from",
                  "    /// anything else on the machine cannot stand in for one of them.",
              ],
              [
                  "    /// Names a parsed message the way the rest of the probe describes packets.",
                  "    private func name(of message: MIDIMessage) -> String {",
                  "        switch message {",
                  "        case let .noteOn(note, velocity, channel):",
                  '            return "note on ' + BS + '(note) velocity ' + BS + '(velocity) on channel ' + BS + '(Int(channel) + 1)"',
                  "        case let .noteOff(note, velocity, channel):",
                  '            return "note off ' + BS + '(note) velocity ' + BS + '(velocity) on channel ' + BS + '(Int(channel) + 1)"',
                  "        case let .controlChange(controller, value, channel):",
                  '            return "control change ' + BS + '(controller) = ' + BS + '(value) on channel ' + BS + '(Int(channel) + 1)"',
                  "        case let .programChange(program, channel):",
                  '            return "program change ' + BS + '(program) on channel ' + BS + '(Int(channel) + 1)"',
                  "        case let .pitchBend(value, channel):",
                  '            return "pitch bend ' + BS + '(value) on channel ' + BS + '(Int(channel) + 1)"',
                  "        case let .other(status, data):",
                  '            return "status ' + BS + '(status) with ' + BS + '(data.count) byte(s)"',
                  "        }",
                  "    }",
                  "",
                  "    /// Counts only the messages the probe means to send, so a stray packet from",
                  "    /// anything else on the machine cannot stand in for one of them.",
              ],
          )

          edit(
              "Tests/SundayKeysCoreTests/MIDIReceiveProbeTests.swift",
              [
                  '                "MIDI receive probe: the app received 3 message(s): 1 note on, 1 note off, 1 control change",',
              ],
              [
                  '                "MIDI receive probe: the app received 3 message(s): 1 note on, 1 note off, 1 control change",',
                  '                "MIDI receive probe: received note on 60 velocity 100 on channel 1",',
                  '                "MIDI receive probe: received note off 60 velocity 64 on channel 1",',
                  '                "MIDI receive probe: received control change 1 = 64 on channel 1",',
              ],
          )

          script_old = [
              '[[ "$connect_status" -eq 0 ]] || fail "the app reported a connected source but exited with $connect_status instead of 0"',
          ]
          script_new = [
              "# Every line the receive probe printed is published before anything is",
              "# asserted, so a step that fails still carries what the app actually saw.",
              "while IFS= read -r line; do",
              '  [[ -n "$line" ]] || continue',
              "  printf '::notice::%s" + BS + "n' \"$line\"",
              "done < <(sed -n 's/^SundayKeysApp: " + BS + "(MIDI receive probe: .*)$/" + BS + "1/p' \"$log\" | sed 's/ pid=[0-9][0-9]*$//')",
              "",
              '[[ "$connect_status" -eq 0 ]] || fail "the app reported a connected source but exited with $connect_status instead of 0"',
          ]
          edit("tools/midi_smoke.sh", script_old, script_new)

          print("all edits applied")
          PY

      - name: Write the packet-level parser tests
        run: |
          cat > Tests/SundayKeysCoreTests/MIDIMessageParseAllTests.swift <<'SWIFT'
          import XCTest
          import SundayKeysCore

          /// `parseAll` exists because of what the receive probe found: a note on, a
          /// note off and a control change arrived as one packet, and reading only the
          /// first three bytes kept the note on and lost the other two.
          final class MIDIMessageParseAllTests: XCTestCase {
              func testThreeMessagesInOnePacketAreAllParsed() {
                  let packet = MIDIReceiveExpectation().packets.flatMap { $0 }

                  XCTAssertEqual(
                      MIDIMessage.parseAll(packet),
                      [
                          .noteOn(note: 60, velocity: 100, channel: 0),
                          .noteOff(note: 60, velocity: 64, channel: 0),
                          .controlChange(controller: 1, value: 64, channel: 0),
                      ]
                  )
              }

              func testRunningStatusCarriesTheMessageOn() {
                  XCTAssertEqual(
                      MIDIMessage.parseAll([0x90, 60, 100, 62, 100]),
                      [
                          .noteOn(note: 60, velocity: 100, channel: 0),
                          .noteOn(note: 62, velocity: 100, channel: 0),
                      ]
                  )
              }

              func testNoteOnWithZeroVelocityInsideAPacketIsANoteOff() {
                  XCTAssertEqual(
                      MIDIMessage.parseAll([0x90, 60, 100, 60, 0, 0xB0, 1, 64]),
                      [
                          .noteOn(note: 60, velocity: 100, channel: 0),
                          .noteOff(note: 60, velocity: 0, channel: 0),
                          .controlChange(controller: 1, value: 64, channel: 0),
                      ]
                  )
              }

              func testATruncatedMessageAtTheEndIsDropped() {
                  XCTAssertEqual(
                      MIDIMessage.parseAll([0x90, 60, 100, 0x80, 60]),
                      [.noteOn(note: 60, velocity: 100, channel: 0)]
                  )
              }

              func testRealTimeBytesLeaveTheMessagesAroundThemIntact() {
                  XCTAssertEqual(
                      MIDIMessage.parseAll([0xF8, 0x90, 60, 100, 0xFE]),
                      [.noteOn(note: 60, velocity: 100, channel: 0)]
                  )
              }

              func testDataWithNoStatusToApplyItToIsIgnored() {
                  XCTAssertEqual(MIDIMessage.parseAll([60, 100]), [])
              }

              func testEachPacketOnItsOwnParsesTheSameAsParse() {
                  for packet in MIDIReceiveExpectation().packets {
                      XCTAssertEqual(
                          MIDIMessage.parseAll(packet),
                          MIDIMessage.parse(packet).map { [$0] } ?? []
                      )
                  }
              }
          }
          SWIFT

      - name: Commit and push
        run: |
          git rm --quiet .github/workflows/files-update.yml
          git config user.name "WorshipWarehouse"
          git config user.email "worshipwarehousesite@gmail.com"
          git add -A
          git commit -q -m "Parse every message in a MIDI packet [skip ci]" -m "Run 42742938963 failed the receive probe with exit 10: the app parsed the note on and no note off. CoreMIDI delivered the note on, the note off and the control change as one packet, and the input service read only the first three bytes of each packet, so the two behind the note on were dropped. MIDIMessage now has a packet-level parseAll, the input port hands it whole packets, the probe prints a line per parsed message, and the smoke check publishes those lines as notices before it asserts anything."
          git push --quiet origin HEAD:main
