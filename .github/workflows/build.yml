name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests -v 2>&1 | tee /tmp/build.log

      - name: Report build diagnostics
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Test
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee /tmp/test.log

      - name: Report test diagnostics
        if: failure()
        run: |
          grep -E "error:|XCTAssert|failed" /tmp/test.log | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done
