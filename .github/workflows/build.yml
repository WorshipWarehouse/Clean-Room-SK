name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: swift --version
      - name: build
        run: swift build --build-tests -v
      - name: test
        run: swift test -v
