name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the older run: the branch tip is what has to be green.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Report the toolchain
        run: |
          set -o pipefail
          xcode-select -p
          xcodebuild -version || true
          swift --version
          xcrun --find swift

      - name: Resolve dependencies
        run: |
          set -o pipefail
          swift package resolve
          swift package show-dependencies

      - name: Build (debug, with tests)
        run: |
          set -o pipefail
          swift build --build-tests -v 2>&1 | tee /tmp/build.log

      - name: Report warnings
        if: success()
        run: |
          { grep -E "warning:" /tmp/build.log || true; } | sort -u | head -n 20 | while IFS= read -r line; do
            echo "::warning::$line"
          done

      - name: Report build diagnostics
        if: failure()
        run: |
          { grep -E "error:" /tmp/build.log || true; } | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Test
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee /tmp/test.log

      # The verbose test log is far bigger than a downloaded job log keeps, so the
      # suite totals are republished as step annotations, which the checks API
      # returns in full: the counts stay readable even when the log is truncated.
      # Each kind of line gets its own label: aggregate is the whole-run XCTest
      # summary, suite is every per-suite summary, skipped is any skip report and
      # swift-testing is the Swift Testing runner summary.
      - name: Report test totals
        if: always()
        run: |
          set -o pipefail
          log=/tmp/test.log
          echo "=== TEST SUMMARY BEGIN ==="
          { grep -hE "Executed [0-9]+ tests?, with" "$log" || true; } | tail -n 1
          { grep -hE "Executed [0-9]+ tests?, with" "$log" || true; } | wc -l | tr -d ' '
          { grep -hE "Test run with [0-9]+ tests?" "$log" || true; }
          { grep -hE "tests? skipped|Skipped [0-9]+ tests?" "$log" || true; }
          echo "=== TEST SUMMARY END ==="
          { grep -hE "Executed [0-9]+ tests?, with" "$log" || true; } | tail -n 1 | while IFS= read -r line; do
            echo "::notice::totals: aggregate$line"
          done
          { grep -hE "Executed [0-9]+ tests?, with" "$log" || true; } | while IFS= read -r line; do
            echo "::notice::totals: suite$line"
          done
          { grep -hE "Test run with [0-9]+ tests?" "$log" || true; } | while IFS= read -r line; do
            echo "::notice::totals: swift-testing $line"
          done
          { grep -hE "tests? skipped|Skipped [0-9]+ tests?" "$log" || true; } | while IFS= read -r line; do
            echo "::notice::totals: skipped $line"
          done

      - name: Report test diagnostics
        if: failure()
        run: |
          { grep -E "error:|XCTAssert|failed" /tmp/test.log || true; } | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Build (release)
        if: success()
        run: |
          set -o pipefail
          swift build -c release

      - name: Bundle the app
        if: success()
        run: |
          set -o pipefail
          bash tools/bundle_app.sh 2>&1 | tee /tmp/bundle.log
          app=build/SundayKeys.app
          test -x "$app/Contents/MacOS/SundayKeysApp"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          find "$app" -maxdepth 3 -print

      # Proves the bundle starts, reaches its run loop and exits cleanly. The
      # script prints the session it found, the startup markers the app emitted
      # and the exit status, and fails with the captured output when the app dies,
      # hangs or exits on a signal.
      - name: Launch the app
        if: success()
        run: |
          set -o pipefail
          bash tools/launch_smoke.sh

      # Starts the audio graph from inside the app and reports whether it came up
      # and rendered a voice, or why it could not. A machine with no output device
      # is reported as a limitation with the app's own line, not as a pass.
      - name: Probe the audio start
        if: success()
        run: |
          set -o pipefail
          bash tools/audio_smoke.sh

      # Creates the CoreMIDI client and input port from inside the app and lists
      # the sources it finds, which on a runner with no controller is none. It
      # then publishes a virtual source of its own, proves the port connects it,
      # and sends a note on, a note off and a control change through it, so the
      # step also proves the app's own input block received and parsed real
      # packets and that the note routed to a layer.
      - name: Probe the MIDI start
        if: success()
        run: |
          set -o pipefail
          bash tools/midi_smoke.sh

      # Runs the app's own launch path six times, each with a different stubbed
      # session, and asserts what AppModel applied: licensed for `active`, licensed
      # with a countdown for `grace_period`, refused for `expired`, unlicensed for a
      # missing or unreadable licence, and no verdict at all when the transport throws.
      # No request leaves the runner.
      - name: Probe the licence session
        if: success()
        run: |
          set -o pipefail
          bash tools/licence_smoke.sh

      # The bootstrap script documents the toolchain this package needs. Only its
      # --check path can run unattended: the install path would need Homebrew
      # casks and sudo, so it is left to the developer machine.
      - name: Verify the bootstrap script
        if: success()
        run: |
          set -o pipefail
          status=0
          bash tools/bootstrap.sh --check > /tmp/bootstrap.log 2>&1 || status=$?
          cat /tmp/bootstrap.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::bootstrap.sh --check exited with $status, expected 0 (all present) or 1 (tools missing)"
            exit 1
          fi
          grep -q "Sunday Keys clean room toolchain" /tmp/bootstrap.log || {
            echo "::error::bootstrap.sh did not print its header"
            exit 1
          }
          grep -q "swift" /tmp/bootstrap.log || {
            echo "::error::bootstrap.sh did not inspect the Swift toolchain"
            exit 1
          }
