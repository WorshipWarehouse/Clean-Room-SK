name: click

# The click is generated by the render thread of the running app, so proving it needs
# the bundle and an output device. It lives in its own workflow for the reason
# session.yml does: a workflow's own token may delete a file under .github/workflows
# but may not create or update one, so a step cannot be added to build.yml from a
# runner. A probe that never runs proves nothing, so the proof gets a workflow of its
# own, authored here rather than patched there.
#
# It also hosts the layer editor's row offscreen, because the row's controls are the
# same headless AppKit objects the click's own probe starts without a window: a
# control that cannot be found by name (a hosted SwiftUI slider carries no
# identifier) cannot be proven, and this workflow is where the window's wiring is
# exercised without a display.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: click-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Report the toolchain
        run: |
          set -o pipefail
          swift --version

      # The probe starts the bundle, so it needs the bundle the release build produces.
      - name: Build (release)
        run: |
          set -o pipefail
          swift build -c release

      - name: Bundle the app
        run: |
          set -o pipefail
          bash tools/bundle_app.sh

      - name: Probe the click
        run: |
          set -o pipefail
          bash tools/metronome_smoke.sh

      # The window's own panel controls, hosted offscreen with no window and no display:
      # every slider the layer editor draws is found by name and moved through the model.
      - name: Probe the layer editor's controls
        run: |
          set -o pipefail
          swift test --filter LayerRowViewTests
