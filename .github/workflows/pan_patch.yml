name: pan-patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Apply the stereo position patch
        run: python3 tools/pan_patch.py
      - name: Move the switch brace the patch misplaced
        run: python3 tools/pan_patch_fix.py
      - name: Stop clearing the right channel after the instrument
        run: python3 tools/pan_fix2.py
      - name: Confirm the patch touched every file
        run: git status --short
      - name: Build with tests
        run: swift build --build-tests
      - name: Test
        run: 'set -o pipefail; swift test 2>&1 | tee test.log | grep -E "error:|failed \(" | head -40 | sed "s/^/::error::/"'
      - name: Prepare the commit
        run: git config user.email ci@example.com
      - run: git config user.name "pan patch job"
      - name: Commit
        run: git add -A && git commit -m "Add per-layer stereo position"
      - name: Push
        run: git push origin HEAD:main
