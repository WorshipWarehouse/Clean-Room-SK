name: record-click

# One shot: patch the window and the docs, prove the patched tree still builds,
# commit, delete itself. tools/record_click.py asserts every run it cites and every
# anchor it patches, so a red run or a moved anchor fails the job instead of
# writing a guess, and nothing is committed unless swift build passes first.
#
# Two things learned from the earlier attempts, both silent failures:
#   * actions does not export GITHUB_TOKEN as an environment variable, only the
#     github.token context, so it has to be mapped into env explicitly or the
#     script dies immediately with KeyError.
#   * the default shell is bash -e, so a failing command aborts the step before
#     the log can be re-emitted as annotations; each python step turns errexit
#     off and decides its own exit status at the end.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: the build workflow run that proved the click
        required: false
        default: "42824933255"
      click_run_id:
        description: the click workflow run that probed it on the runner
        required: false
        default: "42824933210"

permissions:
  contents: write

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Record the milestone
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || '42824933255' }}
          CLICK_RUN_ID: ${{ inputs.click_run_id || '42824933210' }}
        run: |
          set +e
          set -o pipefail
          python3 tools/record_click.py 2>&1 | tee /tmp/record.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "recorder: exited $status"
            tail -30 /tmp/record.log | tr -d '\r' | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::${line}"; fi
            done
          fi
          exit "$status"

      - name: Prove the patched tree builds
        run: |
          set +e
          set -o pipefail
          swift build 2>&1 | tee /tmp/patch_build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep "error:" /tmp/patch_build.log | head -20 | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          python3 tools/commit_record.py 2>&1 | tee /tmp/commit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -30 /tmp/commit.log | tr -d '\r' | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::${line}"; fi
            done
          fi
          exit "$status"
