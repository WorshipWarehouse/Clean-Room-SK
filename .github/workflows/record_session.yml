name: record session scope

# One shot. Reads the green build run back from the API and writes what it actually did
# into docs/progress.md and README.md, then deletes itself and the recorder in the same
# commit. A dispatch with a run that did not pass exits non-zero and writes nothing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build run to record, which must have concluded success
        required: true

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The first attempt at this job rewrote both documents and then died on
      # 'Author identity unknown': a hosted runner has no git identity of its own. Set it
      # here rather than inside the recorder, so the recorder keeps doing only its job.
      - name: Identify the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record the run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -o pipefail
          python3 tools/record_session_run.py
          git log -1 --stat
          git show --stat --oneline HEAD
