name: effects-progress
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Append the milestone
        run: |
          python3 tools/append_effects_progress.py
      - name: Commit and push
        run: |
          git config user.name WorshipWarehouse
          git config user.email worshipwarehousesite@gmail.com
          git rm -q .github/workflows/effects-progress.yml tools/append_effects_progress.py
          git add docs
          git commit -q -m "Log the effects chain milestone"
          git push origin HEAD:main
