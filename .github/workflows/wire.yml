name: wire
on:
  workflow_dispatch:
    inputs:
      mode:
        default: patch
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/wire_step_clock.py
        if: inputs.mode == 'patch'
      - run: cat docs/re/step-clock-app.md >> docs/progress.md
        if: inputs.mode == 'doc'
      - run: git config user.email bot@invalid
      - run: git config user.name wire-bot
      - run: git add -A
      - run: git commit -m "wire the step clock into the app"
      - run: git push
