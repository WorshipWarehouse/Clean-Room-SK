name: envelope job

# The Mac is unreachable, so the change is applied, compiled and tested by a runner and
# pushed only when the whole suite is green. The job removes itself and its scripts in the
# same commit that lands the work, so the tree keeps only the permanent workflows.
on:
  push:
    branches: [main]
    paths:
      - tools/envelope_patch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: envelope-job
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report the toolchain
        run: |
          set -o pipefail
          swift --version

      - name: Fix the test's argument order before applying
        run: |
          python3 - <<'PY'
          import pathlib

          # Swift requires a memberwise call's arguments in declaration order.
          path = pathlib.Path("Tests/SundayKeysCoreTests/LayerEnvelopeTests.swift")
          text = path.read_text(encoding="utf-8")
          old = "LayerEnvelope(sustain: 1, decay: 2)"
          new = "LayerEnvelope(decay: 2, sustain: 1)"
          if old not in text:
              raise SystemExit(f"no such call to reorder: {old}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          print("reordered the memberwise call")
          PY

      - name: Apply the patch
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          # The panic path's all-notes-off keeps the instrument's own release length, so the
          # second per-layer release rewrite is dropped before the patch runs.
          path = pathlib.Path("tools/envelope_patch.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'lines = replace_line\(\s*\n\s*lines,\s*\n\s*"voice\.releaseStep = max\(voice\.level / releaseFrames, 1e-7\)",.*?occurrence=2,\s*\n\)\n',
              re.S,
          )
          text, count = pattern.subn("", text)
          print(f"dropped {count} all-notes-off release rewrite")
          path.write_text(text, encoding="utf-8")
          PY
          if ! python3 tools/envelope_patch.py > patch.log 2>&1; then
            cat patch.log
            tail -n 4 patch.log | while IFS= read -r line; do echo "::error title=patch::$line"; done
            exit 1
          fi
          cat patch.log
          if ! python3 tools/envelope_ui.py > ui.log 2>&1; then
            cat ui.log
            tail -n 4 ui.log | while IFS= read -r line; do echo "::error title=ui::$line"; done
            exit 1
          fi
          cat ui.log
          rm -f patch.log ui.log

      - name: Join range expressions the parser reads as a prefix operator
        run: |
          python3 - <<'PY'
          import pathlib

          # A line that starts with `...` is a prefix operator in Swift, not a continuation of
          # the range on the line above, so the two split ranges are joined onto one line.
          joined = 0
          for name in ("Sources/SundayKeysApp/ContentView.swift",):
              path = pathlib.Path(name)
              out = []
              for line in path.read_text(encoding="utf-8").split("\n"):
                  if line.lstrip().startswith("...") and out:
                      out[-1] = out[-1].rstrip() + line.strip()
                      joined += 1
                  else:
                      out.append(line)
              path.write_text("\n".join(out), encoding="utf-8")
          print(f"joined {joined} split range expressions")
          if joined < 2:
              raise SystemExit(f"expected two split ranges, joined {joined}")
          PY

      - name: Scan the generated files for control characters
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          bad = []
          for root in ("Sources", "Tests"):
              for path in pathlib.Path(root).rglob("*.swift"):
                  for number, line in enumerate(path.read_text(encoding="utf-8").split("\n"), 1):
                      for character in line:
                          if ord(character) < 32 and character != "\t":
                              bad.append(f"{path}:{number}: U+{ord(character):04X}")
          if bad:
              print("control characters found:")
              print("\n".join(bad[:20]))
              sys.exit(1)
          print("no control characters in the generated Swift")
          PY

      - name: Build with tests
        run: |
          if ! swift build --build-tests > build.log 2>&1; then
            grep -E "error:" build.log | sed 's/^ *//' | sort -u | head -n 8 | while IFS= read -r line; do echo "::error title=build::$line"; done
            exit 1
          fi
          tail -n 4 build.log
          rm -f build.log

      - name: Test
        run: |
          if ! swift test > test.log 2>&1; then
            grep -E "error:|XCTAssert" test.log | sed 's/^ *//' | sort -u | head -n 8 | while IFS= read -r line; do echo "::error title=test::$line"; done
            exit 1
          fi
          tail -n 6 test.log
          rm -f test.log

      - name: Write the record
        run: |
          set -o pipefail
          python3 tools/envelope_docs.py

      - name: Commit and push
        run: |
          set -o pipefail
          rm -f test.log build.log patch.log ui.log
          git config user.email ci@example.com
          git config user.name "envelope job"
          git rm -q .github/workflows/envelope_job.yml
          git rm -q tools/envelope_patch.py tools/envelope_ui.py tools/envelope_docs.py
          git add -A
          git status --short
          git commit -m "Add per-layer envelope and prove the layer editor's controls"
          git push origin HEAD:main
