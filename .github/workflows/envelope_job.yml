name: envelope job

# The Mac is unreachable, so the change is applied, compiled and tested by a runner and
# pushed only when the whole suite is green. The job removes itself and its scripts in the
# same commit that lands the work, so the tree keeps only the permanent workflows.
on:
  push:
    branches: [main]
    paths:
      - tools/envelope_patch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: envelope-job
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report the toolchain
        run: |
          set -o pipefail
          swift --version

      - name: Apply the patch
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          # The panic path's all-notes-off keeps the instrument's own release length, so the
          # second per-layer release rewrite is dropped before the patch runs.
          path = pathlib.Path("tools/envelope_patch.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'lines = replace_line\(\s*\n\s*lines,\s*\n\s*"voice\.releaseStep = max\(voice\.level / releaseFrames, 1e-7\)",.*?occurrence=2,\s*\n\)\n',
              re.S,
          )
          text, count = pattern.subn("", text)
          print(f"dropped {count} all-notes-off release rewrite")
          path.write_text(text, encoding="utf-8")
          PY
          if ! python3 tools/envelope_patch.py > patch.log 2>&1; then
            cat patch.log
            tail -n 5 patch.log | while IFS= read -r line; do echo "::error title=patch::$line"; done
            exit 1
          fi
          cat patch.log
          if ! python3 tools/envelope_ui.py > ui.log 2>&1; then
            cat ui.log
            tail -n 5 ui.log | while IFS= read -r line; do echo "::error title=ui::$line"; done
            exit 1
          fi
          cat ui.log
          rm -f patch.log ui.log

      - name: Scan the generated files for control characters
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          bad = []
          for root in ("Sources", "Tests"):
              for path in pathlib.Path(root).rglob("*.swift"):
                  for number, line in enumerate(path.read_text(encoding="utf-8").split("\n"), 1):
                      for character in line:
                          if ord(character) < 32 and character != "\t":
                              bad.append(f"{path}:{number}: U+{ord(character):04X}")
          if bad:
              print("control characters found:")
              print("\n".join(bad[:20]))
              sys.exit(1)
          print("no control characters in the generated Swift")
          PY

      - name: Build with tests
        run: |
          if ! swift build --build-tests > build.log 2>&1; then
            grep -E "error:" build.log | head -n 8 | while IFS= read -r line; do echo "::error title=build::$line"; done
            tail -n 20 build.log
            exit 1
          fi
          tail -n 5 build.log
          rm -f build.log

      - name: Test
        run: |
          if ! swift test > test.log 2>&1; then
            grep -E "error:|: failed|XCTAssert" test.log | head -n 8 | while IFS= read -r line; do echo "::error title=test::$line"; done
            tail -n 25 test.log
            exit 1
          fi
          tail -n 8 test.log
          rm -f test.log

      - name: Write the record
        run: |
          set -o pipefail
          python3 tools/envelope_docs.py

      - name: Commit and push
        run: |
          set -o pipefail
          rm -f test.log build.log patch.log ui.log
          git config user.email ci@example.com
          git config user.name "envelope job"
          git rm -q .github/workflows/envelope_job.yml
          git rm -q tools/envelope_patch.py tools/envelope_ui.py tools/envelope_docs.py
          git add -A
          git status --short
          git commit -m "Add per-layer envelope and prove the layer editor's controls"
          git push origin HEAD:main
