name: record-arpeggiator

# One shot. Inserts docs/re/arpeggiator-proof.md into docs/progress.md before the next-actions
# heading, then removes the proof file and itself, so the text lives in the write-up alone. The
# commit it pushes carries no run of its own by design and changes documentation only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Record the milestone
        run: |
          set +e
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/record.log
          import pathlib, subprocess, sys

          doc = pathlib.Path("docs/progress.md")
          text = doc.read_text()
          section = pathlib.Path("docs/re/arpeggiator-proof.md").read_text()
          marker = "## Next actions, in order"

          if "Arpeggiator milestone" in text:
              print("record: the milestone is already written")
              sys.exit(0)
          if text.count(marker) != 1:
              print(f"record check: expected one next-actions heading, found {text.count(marker)}")
              sys.exit(1)

          doc.write_text(text.replace(marker, section + marker, 1))
          print("record: the milestone is in place")

          subprocess.run(["git", "config", "user.name", "Sunday Keys CI"], check=True)
          subprocess.run(["git", "config", "user.email", "actions@users.noreply.github.com"], check=True)
          subprocess.run(["git", "rm", "-q", "docs/re/arpeggiator-proof.md"], check=True)
          subprocess.run(["git", "rm", "-q", ".github/workflows/record_arpeggiator.yml"], check=True)
          subprocess.run(["git", "add", "docs/progress.md"], check=True)
          subprocess.run(
              ["git", "commit", "-m", "Record the arpeggiator milestone and the runs that proved it"],
              check=True,
          )
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print("record: pushed")
          PY
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -30 /tmp/record.log | tr -d '\r' | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::${line}"; fi
            done
          fi
          exit "$status"
