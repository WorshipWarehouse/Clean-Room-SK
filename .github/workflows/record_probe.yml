name: record session probe

# One shot. Reads the green build run and the green session run back from the API, writes
# what they actually did into docs/progress.md and README.md, removes itself, commits, and
# then starts the build on the documenting commit so the final head is verified too.
# A dispatch whose runs did not pass, or whose test or probe step did not pass, exits
# non-zero and writes nothing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build run to record, which must have concluded success
        required: true

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Identify the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record the runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["RUN_ID"]


          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          def clock(stamp):
              return stamp[11:19] if stamp else "-"


          def steps_of(run_id):
              return api(f"/actions/runs/{run_id}/jobs?filter=all")["jobs"][0]["steps"]


          def require_step(steps, name, where):
              for step in steps:
                  if step["name"] == name:
                      if step.get("conclusion") != "success":
                          sys.exit(f"record: {name!r} in {where} concluded {step.get('conclusion')!r}")
                      return step
              sys.exit(f"record: {where} has no {name!r} step")


          build = api(f"/actions/runs/{run_id}")
          if build.get("conclusion") != "success":
              sys.exit(f"record: build run {run_id} concluded {build.get('conclusion')!r}, nothing written")
          build_steps = steps_of(run_id)
          test = require_step(build_steps, "Test", "the build run")

          latest = api("/actions/workflows/session.yml/runs?per_page=1")["workflow_runs"]
          if not latest:
              sys.exit("record: the session workflow has no runs")
          session = latest[0]
          if session.get("conclusion") != "success":
              sys.exit(f"record: session run {session['id']} concluded {session.get('conclusion')!r}")
          if session["head_sha"] != build["head_sha"]:
              sys.exit(f"record: session run {session['id']} is on {session['head_sha'][:7]}, the build on {build['head_sha'][:7]}")
          session_steps = steps_of(session["id"])
          probe = require_step(session_steps, "Probe the session resume", "the session run")

          test_window = f"{clock(test['started_at'])}-{clock(test['completed_at'])}"
          probe_window = f"{clock(probe['started_at'])}-{clock(probe['completed_at'])}"

          progress = pathlib.Path("docs/progress.md")
          lines = progress.read_text().splitlines()

          hits = [index for index, line in enumerate(lines) if line.startswith("| Build, session scope |")]
          if len(hits) != 1:
              sys.exit(f"record: expected one session scope phase row, found {len(hits)}")
          lines.insert(
              hits[0] + 1,
              "| Build, session relaunch | the bundle is started three times against one folder - the write, "
              "the relaunch and a hint naming a deleted patch - and each run's own lines are asserted | "
              f"`tools/session_smoke.sh`, runs `{run_id}` and `{session['id']}` |",
          )

          anchors = [index for index, line in enumerate(lines) if line.strip() == "## Next actions, in order"]
          if len(anchors) != 1:
              sys.exit(f"record: expected one next actions heading, found {len(anchors)}")
          lines[anchors[0]:anchors[0]] = [
              "## Relaunch milestone: a launch that resumes, proven on disk",
              "",
              "The resume was implemented and unit-tested, but no process had ever started the app",
              "twice against one Application Support folder, so the hint file had never been read",
              f"back by a second launch. Runs `{run_id}` and `{session['id']}` close that:",
              "`tools/session_smoke.sh` starts the bundle three times with one `HOME`, and each run",
              "has to print what it did.",
              "",
              "- **The write run** saves a bank of three patches and a hint naming the third, then",
              "  prints the folder it used, so the step reports which files the launch read.",
              "- **The relaunch** is a second process: `SessionProbe` constructs the same `AppModel` the",
              "  window constructs, so `loadBank`, `SessionScope.restore` and the head alignment run over",
              "  the files the first process left. It prints the status line, the selected patch and the",
              "  head's position, and the script requires `Resumed Rehearsal Pad, 3 patches and 3 set",
              "  list slots` and `play head on slot 3 of 3`.",
              "- **The missing-patch run** writes a hint naming a patch the bank does not have, and the",
              "  launch has to print `Opened Sunday Keys: the patch from the last launch is gone` and",
              "  stand on slot 1, so the fallback is a sentence and a position rather than a branch.",
              "- **The probe decides nothing.** It reports, and its exit status is a comparison of that",
              "  report against the expected value; the script asserts the printed lines too.",
              "",
              f"The build run is green with the Swift suite at {test_window}, and the session run is",
              f"green with the probe at {probe_window}. The probe had to become its own workflow: the",
              "build workflow's token may delete a file under `.github/workflows` but may not create or",
              "update one, so adding the step there was rejected by the remote with `refusing to allow a",
              "GitHub App to create or update workflow`. That refusal is in run",
              "`42821552394` for anyone who wants to see it.",
              "",
              "What this does not prove: that a person sees the window open on the remembered patch.",
              "The probe proves the state the window is built from, on a machine with no display.",
              "",
          ]

          start = [index for index, line in enumerate(lines) if line.startswith("4. **A launch that resumes.**")]
          if len(start) != 1:
              sys.exit(f"record: expected one relaunch next action, found {len(start)}")
          end = start[0] + 1
          while end < len(lines) and lines[end].startswith("   ") and lines[end].strip():
              end += 1
          if end - start[0] < 2:
              sys.exit("record: the relaunch next action did not look like a wrapped paragraph")
          lines[start[0]:end] = [
              "4. **A relaunch on a real Mac.** The on-disk resume runs in CI now: run",
              f"   `{session['id']}` started the app three times against one folder, and the second launch",
              "   printed the resumed patch with the play head on its slot. What is still missing is a",
              "   person watching the window open on that patch, which needs the unreachable Mac.",
          ]

          progress.write_text("\n".join(lines) + "\n")

          readme = pathlib.Path("README.md")
          rows = readme.read_text().splitlines()
          hits = [index for index, line in enumerate(rows) if line.startswith("| session resumed on launch |")]
          if len(hits) != 1:
              sys.exit(f"record: expected one session status row, found {len(hits)}")
          rows.insert(
              hits[0] + 1,
              "| relaunch proven on disk | "
              f"run `{session['id']}` starts the bundle three times against one folder: one writes a bank "
              "and remembers the third patch, the next launch prints the resumed patch with the play head "
              "on its slot, and a hint naming a deleted patch falls back with its reason |",
          )
          readme.write_text("\n".join(rows) + "\n")

          print(f"record: build {run_id} tests {test_window}, session {session['id']} probe {probe_window}")
          print("record: docs/progress.md and README.md written")
          PY

      - name: Remove this job
        run: git rm --quiet .github/workflows/record_probe.yml

      - name: Commit and push
        run: |
          set -o pipefail
          git add -A
          git commit -m "Record the relaunch milestone and the runs that proved it [skip ci]"
          git push
          git show --stat --oneline HEAD

      - name: Start the build on the documenting commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "dispatched the build on $(git rev-parse HEAD)"
