name: record-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Correct the record on main
        shell: bash
        run: |
          set -o pipefail
          cp tools/apply_correction.py /tmp/apply_correction.py
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "WorshipWarehouse"
          git config user.email "worshipwarehousesite@gmail.com"
          python3 /tmp/apply_correction.py
          git rm -q .github/workflows/record-fix.yml tools/apply_correction.py
          git add docs/progress.md docs/re/final-head-77119a68.md
          git commit -F /tmp/message.txt
          git push origin main
          git log -1 --format=%H
