name: docs-fix

# Second one-shot recorder: moves the commit-trail rows the first one misplaced and
# rewrites two clauses that the connect probe made stale. Deleted together with
# docs-update.yml once the record is right.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Apply the repair
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          progress = pathlib.Path("docs/progress.md")
          lines = progress.read_text().split("\n")

          matches = [i for i, line in enumerate(lines) if line.startswith("| `a84c56e` |")]
          if len(matches) != 1:
              sys.exit(f"expected one first misplaced row, found {len(matches)}")
          start = matches[0]
          end = start
          while end < len(lines) and lines[end].startswith("| "):
              end += 1
          rows = lines[start:end]
          if len(rows) != 8:
              sys.exit(f"expected 8 misplaced rows, found {len(rows)}")
          del lines[start:end]
          if lines[start - 1].strip() == "" or not lines[start - 1].startswith("| "):
              sys.exit("the decisions table did not close cleanly after the move")

          text = "\n".join(lines).rstrip("\n")
          text += "\n" + "\n".join(rows)
          text += "\n| `2d8738c` | the one-shot recorder workflow, because the log is larger than one API call can replace |"
          text += "\n| `175cb77` | the connect milestone, the revised next actions and the README section; written by recorder run `42741151494` and read back at that commit |"
          text += "\n"

          text, count = re.subn(
              r"and the MIDI connect path, since the runner has no source to\s+connect to\.",
              "and the MIDI receive path, since nothing has ever been sent from the virtual source.",
              text,
          )
          if count != 1:
              sys.exit(f"the stale MIDI-connect clause matched {count} times")
          text, count = re.subn(
              r"which creates the CoreMIDI client and input port from inside the app,",
              "which creates the CoreMIDI client and input port from inside the app, publishes a virtual\nsource of its own and requires the engine to enumerate and connect it,",
              text,
          )
          if count != 1:
              sys.exit(f"the midi_smoke list item matched {count} times")
          progress.write_text(text)

          readme = pathlib.Path("README.md")
          text = readme.read_text()
          old = "tools/midi_smoke.sh    # create the MIDI client and port, prove the source list was read"
          if text.count(old) != 1:
              sys.exit(f"the midi_smoke run line matched {text.count(old)} times")
          readme.write_text(text.replace(
              old,
              "tools/midi_smoke.sh    # create the client and port, publish a virtual source, prove it connects",
          ))

          print("repaired")
          PY

      - name: Show what changed
        run: git --no-pager diff --stat

      - name: Commit and push
        run: |
          git config user.name "WorshipWarehouse"
          git config user.email "worshipwarehousesite@gmail.com"
          git add docs/progress.md README.md
          git commit -m "Move the commit rows into the commit trail [skip ci]"
          git push
