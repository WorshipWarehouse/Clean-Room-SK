name: concurrency

# The proof that the MIDI routing seam compiles with complete concurrency
# checking. Its substance is unchanged: tools/strict_concurrency.sh.
#
# When it runs was the problem. Started by the same push as the build, its
# job sat queued with no runner attached for four attempts while the build
# beside it got one, and only a fresh dispatch ran it. It now starts when the
# build for the same commit has finished, which takes it out of the burst
# that starves it, and it checks out the commit that build ran for rather
# than whatever the branch tip is by then.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per commit: a re-run of the same head supersedes the older one.
concurrency:
  group: strict-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  strict:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Report the commit under test
        run: git rev-parse HEAD

      - name: Report the toolchain
        run: swift --version

      - name: Build with complete concurrency checking
        run: bash tools/strict_concurrency.sh build

      - name: Prove the flag reached the compiler
        run: bash tools/strict_concurrency.sh flag

      - name: Report every concurrency diagnostic
        run: bash tools/strict_concurrency.sh report

      - name: Fail on diagnostics in the MIDI routing seam
        run: bash tools/strict_concurrency.sh gate
