name: record receive
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write the record
        run: python3 tools/record_receive.py
      - name: Commit and push
        run: |
          git config user.name WorshipWarehouse
          git config user.email worshipwarehousesite@gmail.com
          git rm -q .github/workflows/record.yml tools/record_receive.py
          git add -A
          git commit -m "Record the MIDI receive runs and the packet defect they caught [skip ci]"
          git push
